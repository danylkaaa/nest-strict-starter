services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in .env}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/01-create-database.sh:/docker-entrypoint-initdb.d/01-create-database.sh:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'psql -U "$$POSTGRES_USER" -d "$$DATABASE_NAME" -c ''SELECT 1'' >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  postgres-data:
